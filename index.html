<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareCloset - 의류 세탁 정보 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>CareCloset</h1>
        <p class="tagline">내 옷의 세탁 방법, 라벨 없이도 바로 확인</p>
      </div>
      <button type="button" id="open-add" class="btn btn-primary">+ 의류 등록</button>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="검색과 필터">
      <label class="search-box">
        <span class="visually-hidden">옷 이름 검색</span>
        <input type="search" id="search-input" placeholder="옷 이름으로 검색 (예: 니트)" autocomplete="off">
      </label>
      <div id="season-filter" class="chips" role="group" aria-label="계절 필터">
        <button type="button" class="chip is-active" data-season="" aria-pressed="true">전체</button>
        <button type="button" class="chip" data-season="봄" aria-pressed="false">봄</button>
        <button type="button" class="chip" data-season="여름" aria-pressed="false">여름</button>
        <button type="button" class="chip" data-season="가을" aria-pressed="false">가을</button>
        <button type="button" class="chip" data-season="겨울" aria-pressed="false">겨울</button>
      </div>
    </section>

    <p id="result-summary" class="result-summary" aria-live="polite"></p>
    <p id="empty-message" class="empty-message" role="status" hidden></p>
    <ul id="clothes-list" class="clothes-grid" aria-label="의류 목록"></ul>

    <details class="data-tools">
      <summary>데이터 관리 (백업·불러오기)</summary>
      <p class="hint">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하거나 다른 기기로 옮길 때는 내보내기/가져오기를 사용하세요.</p>
      <div class="tool-buttons">
        <button type="button" id="export-btn" class="btn">내보내기 (JSON)</button>
        <label class="btn" for="import-input">가져오기 (JSON)</label>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
      </div>
    </details>
  </main>

  <!-- 상세 보기 -->
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기">×</button>
      </div>
      <div id="detail-content"></div>
      <div class="dialog-actions">
        <button type="button" id="detail-delete" class="btn btn-danger">삭제</button>
        <button type="button" id="detail-edit" class="btn btn-primary">수정</button>
      </div>
    </div>
  </dialog>

  <!-- 등록/수정 폼 -->
  <dialog id="form-dialog" aria-labelledby="form-title">
    <form id="clothing-form" class="dialog-body" novalidate>
      <div class="dialog-head">
        <h2 id="form-title">의류 등록</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기">×</button>
      </div>

      <fieldset>
        <legend>기본 정보</legend>

        <div class="field">
          <label for="f-name">옷 이름 <span class="required">*필수</span></label>
          <input type="text" id="f-name" placeholder="예: 검은색 기본 니트" aria-describedby="err-name">
          <p class="field-error" id="err-name" role="alert"></p>
        </div>

        <div class="field">
          <label for="f-material">재질</label>
          <input type="text" id="f-material" placeholder="예: 울 혼방, 면 100%" aria-describedby="err-material">
          <p class="field-error" id="err-material" role="alert"></p>
        </div>

        <div class="field">
          <span class="label">계절 태그 (여러 개 선택 가능)</span>
          <div id="f-seasons" class="check-row">
            <label class="check"><input type="checkbox" name="seasons" value="봄"> 봄</label>
            <label class="check"><input type="checkbox" name="seasons" value="여름"> 여름</label>
            <label class="check"><input type="checkbox" name="seasons" value="가을"> 가을</label>
            <label class="check"><input type="checkbox" name="seasons" value="겨울"> 겨울</label>
          </div>
          <p class="field-error" id="err-seasons" role="alert"></p>
        </div>

        <div class="field">
          <label for="f-clothing-image">옷 사진 (선택)</label>
          <input type="file" id="f-clothing-image" accept="image/*" aria-describedby="err-clothingImage">
          <div class="preview-row" id="clothing-preview-row" hidden>
            <img id="clothing-preview" alt="옷 사진 미리보기">
            <button type="button" class="btn btn-small" id="clothing-remove">사진 제거</button>
          </div>
          <p class="field-error" id="err-clothingImage" role="alert"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend>세탁 정보</legend>

        <div class="field">
          <label for="f-label-image">세탁 택(라벨) 사진 (선택)</label>
          <input type="file" id="f-label-image" accept="image/*" aria-describedby="err-labelImage">
          <p class="hint">라벨을 떼기 전에 찍어 두세요. 글자는 자동 인식되지 않으니 아래 항목은 직접 입력합니다.</p>
          <div class="preview-row" id="label-preview-row" hidden>
            <img id="label-preview" alt="세탁 택 사진 미리보기">
            <button type="button" class="btn btn-small" id="label-remove">사진 제거</button>
          </div>
          <p class="field-error" id="err-labelImage" role="alert"></p>
        </div>

        <div class="field">
          <label for="f-washing">세탁 방식</label>
          <select id="f-washing"></select>
        </div>

        <div class="field">
          <label for="f-water">물 온도</label>
          <select id="f-water"></select>
          <input type="text" id="f-water-custom" placeholder="물 온도를 직접 입력" hidden aria-label="물 온도 직접 입력" aria-describedby="err-waterTemperature">
          <p class="field-error" id="err-waterTemperature" role="alert"></p>
        </div>

        <div class="field">
          <label for="f-drying">건조 방법</label>
          <select id="f-drying"></select>
        </div>

        <div class="field">
          <label for="f-notes">기타 주의사항</label>
          <textarea id="f-notes" rows="3" placeholder="예: 비틀어 짜지 말고 눕혀서 말리기" aria-describedby="err-notes"></textarea>
          <p class="field-error" id="err-notes" role="alert"></p>
        </div>
      </fieldset>

      <div class="dialog-actions">
        <button type="button" class="btn" data-close>취소</button>
        <button type="submit" class="btn btn-primary" id="save-btn">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/clothes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
